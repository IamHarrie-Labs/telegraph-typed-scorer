[package]
name    = "telegraph-typed-scorer"
version = "0.1.0"
edition = "2021"

# ── Build target ──────────────────────────────────────────────────────────────
# cargo build --target wasm32-unknown-unknown --release
# Output: target/wasm32-unknown-unknown/release/telegraph_scoring.wasm
[lib]
crate-type = ["cdylib"]

# ── Features ──────────────────────────────────────────────────────────────────
[features]
default = []
# Activate once you have run scripts/export_minilm_weights.py
real_weights = []
# Per-intent numeric tolerance. Pick one at build time; one binary is
# registered per intent anyway. Default (neither set) is 0.5% relative error.
tol_exact = []   # counts and IDs: TOKEN_HOLDER_COUNT, ONCHAIN_TX_LOOKUP
tol_loose = []   # volatile: GAS_PRICE

# ── Dependencies ──────────────────────────────────────────────────────────────
[dependencies]
# Allocator for no_std WASM
dlmalloc = { version = "0.2", features = ["global"] }
# Pure-Rust math (exp, sqrt, tanh …) — no libc, no host calls
libm     = { version = "0.2", default-features = false }

# ── Release profile ───────────────────────────────────────────────────────────
[profile.release]
opt-level     = "z"     # minimise binary size
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
